[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-bw4hana-lsa-anomaly-detection"
version = "0.1.0"
description = "Research-grade SAP BW/4HANA LSA++ architectural emulation for semantic data quality and anomaly detection"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "psutil>=5.9",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tn-anomaly = "tn_anomaly.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
